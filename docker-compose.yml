services:
  ctm-lab-mock:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir cryptography && python mock-cm-ce/server.py"
    ports:
      - "8443:8443"
    environment:
      CM_ADMIN_USER: ${CIPHERTRUST_USER:-admin}
      CM_ADMIN_PASSWORD: ${CIPHERTRUST_PASSWORD:-lab-bootstrap-pass}
      CM_REQUIRE_MTLS: "true"
    volumes:
      - ./mock-cm-ce:/app/mock-cm-ce:ro
      - ./certs:/app/certs:ro
